name: pythonic
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  webview_flutter: ^4.2.2
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  flutter_native_splash: ^2.4.7
  # svgator_player_flutter eliminado: su pubspec exige Dart <=3.10.0,
  # y tu SDK es 3.11.1. El código de ese paquete ahora vive localmente
  # en lib/vendor/svgator_player.dart (ver svgator_player.dart adjunto).

dependency_overrides:
  webview_flutter: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/spain_flag.png
    - assets/united_kingdom.png
    - assets/pip_greeting.json
    - assets/pip_greeting.svg
    - assets/boss.svg
    - assets/tea.svg
    - assets/pc_escritorio.svg
    - assets/toolbox.svg
    - assets/lupa.svg
    - assets/blink.svg
    - assets/fondo.jpg
    - assets/analysis.png

  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Arimo/Arimo-BoldItalic.ttf
          style: italic
          weight: 700
